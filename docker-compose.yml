services:
    gestionando_te:
      build: .
      ports:
           - "8000:80"
      depends_on:
           - mysql_database

    mysql_database:
      image: mysql:8.0
      environment:
         MYSQL_DATABASE: ${DB_DATABASE}
         MYSQL_USER: ${DB_USERNAME}
         MYSQL_PASSWORD: ${DB_PASSWORD}
      ports:
          - "3307:3306"